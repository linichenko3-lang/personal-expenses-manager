{% extends 'base.html' %}

{% block title %}Редагування транзакції{% endblock %}

{% block content %}

<h2>Редагування транзакції №{{ transaction.id }}</h2>

<form method="POST">
    {% csrf_token %}

    <div>
        <label for="amount">Сума (грн):</label>
        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0.01"
            value="{{ transaction.amount }}"
            required
        >
    </div>

    <div>
        <label for="category">Категорія:</label>
        <input
            type="text"
            id="category"
            name="category"
            value="{{ transaction.category }}"
            required
        >
    </div>

    <div>
        <label for="description">Опис:</label>
        <textarea
            id="description"
            name="description"
            rows="4"
        >{{ transaction.description }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">
        Зберегти зміни
    </button>

    <a href="{% url 'transactions_list' %}">Скасувати</a>
</form>

{% endblock %}
