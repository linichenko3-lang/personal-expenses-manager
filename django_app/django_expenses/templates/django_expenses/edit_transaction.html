{% extends 'base.html' %}

{% block title %}Редагування транзакції{% endblock %}

{% block content %}

<h2>Редагування транзакції №{{ transaction.id }}</h2>

<form method="POST">
    {% csrf_token %}

    <div>
        <label for="amount">Сума (грн):</label>
        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0.01"
            value="{{ transaction.amount }}"
            required
        >
    </div>
    
<div>
    <label for="transaction_type">Тип транзакції:</label>
    <select id="transaction_type" name="transaction_type" required>
        <option
            value="income"
            {% if transaction.transaction_type == "income" %}selected{% endif %}
        >
            Дохід
        </option>

        <option
            value="expense"
            {% if transaction.transaction_type == "expense" %}selected{% endif %}
        >
            Видаток
        </option>
    </select>
</div>

    <div>
    <label for="category">Категорія:</label>
    <select id="category" name="category" required>
        {% for category in categories %}
            <option
                value="{{ category.name }}"
                {% if transaction.category_id == category.id %}selected{% endif %}
            >
                {{ category.name }}
            </option>
        {% endfor %}
    </select>
</div>


    <div>
        <label for="description">Опис:</label>
        <textarea
            id="description"
            name="description"
            rows="4"
        >{{ transaction.description }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">
        Зберегти зміни
    </button>

    <a href="{% url 'transactions_list' %}">Скасувати</a>
</form>

{% endblock %}
