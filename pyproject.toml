[project]
name = "personal-expenses-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tetiana Linichenko", email = "linichenko3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.8",
    "requests>=2.34.2",
]

[project.scripts]
personal-expenses-manager = "personal_expenses_manager:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
